<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="projBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A0F" />
      <stop offset="100%" stop-color="#0B0F17" />
    </linearGradient>

    <linearGradient id="projHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="60%" stop-color="#00E5FF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FF304F" />
    </linearGradient>
  </defs>

  <style>
    .p-mono { font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace; }
    .p-title-cyan { fill: #00E5FF; font-size: 12px; font-weight: 700; }
    .p-title-red { fill: #FF304F; font-size: 12px; font-weight: 700; }
    .p-desc { fill: #c9d1d9; font-size: 10px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .p-tag { fill: #8B949E; font-size: 9.5px; font-family: 'SF Mono', monospace; }
  </style>

  <!-- Frame Background -->
  <rect width="900" height="480" rx="8" fill="url(#projBg)" stroke="#162032" stroke-width="1.5" />

  <!-- Top Bar -->
  <rect width="900" height="34" rx="8" fill="#111722" stroke="#162032" stroke-width="1" />
  <line x1="0" y1="34" x2="900" y2="34" stroke="url(#projHeader)" stroke-width="1.2" />

  <text x="24" y="21" fill="#00E5FF" font-size="11" font-weight="700" letter-spacing="1.5" class="p-mono">
    [ RESEARCH REPOSITORIES ] :: FLAGSHIP CYBERSECURITY WORK
  </text>
  <text x="876" y="21" fill="#8B949E" font-size="10" font-weight="600" text-anchor="end" class="p-mono">
    6 ACTIVE REPOSITORIES // OPEN SOURCE
  </text>

  <!-- Grid of 6 Projects (2 Cols x 3 Rows) -->
  <g transform="translate(24, 48)">

    <!-- ROW 1 -->
    <!-- Card 1: NetVision -->
    <g transform="translate(0, 10)">
      <rect width="418" height="124" rx="5" fill="#111722" stroke="#1c283c" stroke-width="1" />
      <line x1="0" y1="0" x2="3" y2="124" stroke="#00E5FF" stroke-width="3" />
      <text x="16" y="24" class="p-mono p-title-cyan">[+] NetVision :: PACKET TELEMETRY SUITE</text>
      <text x="16" y="44" class="p-desc">Real-time network traffic dissector for deep packet inspection,</text>
      <text x="16" y="58" class="p-desc">promiscuous packet capture, anomaly classification &amp; forensic logs.</text>
      <!-- Tags -->
      <g transform="translate(16, 78)">
        <rect x="0" y="0" width="60" height="18" rx="2" fill="#162234" />
        <text x="30" y="12" text-anchor="middle" class="p-tag" fill="#00E5FF">Python</text>
        <rect x="66" y="0" width="56" height="18" rx="2" fill="#162234" />
        <text x="94" y="12" text-anchor="middle" class="p-tag">Scapy</text>
        <rect x="128" y="0" width="92" height="18" rx="2" fill="#162234" />
        <text x="174" y="12" text-anchor="middle" class="p-tag">Raw Sockets</text>
        <rect x="226" y="0" width="80" height="18" rx="2" fill="#162234" />
        <text x="266" y="12" text-anchor="middle" class="p-tag">Telemetry</text>
      </g>
      <text x="16" y="112" fill="#00E5FF" font-size="9" font-family="'SF Mono', monospace">STATUS: ARCHITECTED &amp; OPERATIONAL</text>
    </g>

    <!-- Card 2: Network-Security-Lab -->
    <g transform="translate(434, 10)">
      <rect width="418" height="124" rx="5" fill="#111722" stroke="#1c283c" stroke-width="1" />
      <line x1="0" y1="0" x2="3" y2="124" stroke="#FF304F" stroke-width="3" />
      <text x="16" y="24" class="p-mono p-title-red">[+] Network-Security-Lab :: LAB SUITE</text>
      <text x="16" y="44" class="p-desc">Comprehensive academic &amp; practical laboratory implementations of</text>
      <text x="16" y="58" class="p-desc">cryptosystems, packet analysis pipelines, and MITM defense scenarios.</text>
      <!-- Tags -->
      <g transform="translate(16, 78)">
        <rect x="0" y="0" width="112" height="18" rx="2" fill="#162234" />
        <text x="56" y="12" text-anchor="middle" class="p-tag" fill="#FF304F">Network Security</text>
        <rect x="118" y="0" width="76" height="18" rx="2" fill="#162234" />
        <text x="156" y="12" text-anchor="middle" class="p-tag">Wireshark</text>
        <rect x="200" y="0" width="90" height="18" rx="2" fill="#162234" />
        <text x="245" y="12" text-anchor="middle" class="p-tag">Defense Labs</text>
      </g>
      <text x="16" y="112" fill="#8B949E" font-size="9" font-family="'SF Mono', monospace">LABS: EXP 01 - EXP 08 IMPLEMENTED</text>
    </g>

    <!-- ROW 2 -->
    <!-- Card 3: Offensive & Defensive Security -->
    <g transform="translate(0, 146)">
      <rect width="418" height="124" rx="5" fill="#111722" stroke="#1c283c" stroke-width="1" />
      <line x1="0" y1="0" x2="3" y2="124" stroke="#FF304F" stroke-width="3" />
      <text x="16" y="24" class="p-mono p-title-red">[+] Offensive &amp; Defensive Security :: LABS</text>
      <text x="16" y="44" class="p-desc">Adversary exploitation mechanics, privilege escalation vectors,</text>
      <text x="16" y="58" class="p-desc">system telemetry detection, and security benchmark hardening scripts.</text>
      <!-- Tags -->
      <g transform="translate(16, 78)">
        <rect x="0" y="0" width="70" height="18" rx="2" fill="#162234" />
        <text x="35" y="12" text-anchor="middle" class="p-tag" fill="#FF304F">Red Team</text>
        <rect x="76" y="0" width="70" height="18" rx="2" fill="#162234" />
        <text x="111" y="12" text-anchor="middle" class="p-tag">Blue Team</text>
        <rect x="152" y="0" width="134" height="18" rx="2" fill="#162234" />
        <text x="219" y="12" text-anchor="middle" class="p-tag">Privilege Escalation</text>
      </g>
      <text x="16" y="112" fill="#FF304F" font-size="9" font-family="'SF Mono', monospace">ATT&amp;CK MAPPING // ACTIVE DEFENSE</text>
    </g>

    <!-- Card 4: Red Teaming Fundamentals -->
    <g transform="translate(434, 146)">
      <rect width="418" height="124" rx="5" fill="#111722" stroke="#1c283c" stroke-width="1" />
      <line x1="0" y1="0" x2="3" y2="124" stroke="#00E5FF" stroke-width="3" />
      <text x="16" y="24" class="p-mono p-title-cyan">[+] Red Teaming Fundamentals :: EMULATION</text>
      <text x="16" y="44" class="p-desc">Curated repository containing stealth reconnaissance methodology,</text>
      <text x="16" y="58" class="p-desc">automated host enumeration scripts, and lateral movement detection.</text>
      <!-- Tags -->
      <g transform="translate(16, 78)">
        <rect x="0" y="0" width="134" height="18" rx="2" fill="#162234" />
        <text x="67" y="12" text-anchor="middle" class="p-tag" fill="#00E5FF">Adversary Simulation</text>
        <rect x="140" y="0" width="80" height="18" rx="2" fill="#162234" />
        <text x="180" y="12" text-anchor="middle" class="p-tag">Bash Script</text>
        <rect x="226" y="0" width="112" height="18" rx="2" fill="#162234" />
        <text x="282" y="12" text-anchor="middle" class="p-tag">Post-Exploitation</text>
      </g>
      <text x="16" y="112" fill="#8B949E" font-size="9" font-family="'SF Mono', monospace">TACTICS: RECON // ENUM // PIVOT</text>
    </g>

    <!-- ROW 3 -->
    <!-- Card 5: Cryptography & Secure Protocols -->
    <g transform="translate(0, 282)">
      <rect width="418" height="124" rx="5" fill="#111722" stroke="#1c283c" stroke-width="1" />
      <line x1="0" y1="0" x2="3" y2="124" stroke="#00E5FF" stroke-width="3" />
      <text x="16" y="24" class="p-mono p-title-cyan">[+] Crypto &amp; Secure Protocols :: CIPHERS</text>
      <text x="16" y="44" class="p-desc">Applied implementations of symmetric/asymmetric algorithms (AES-256,</text>
      <text x="16" y="58" class="p-desc">RSA-4096, ECC, HMAC) and verification of TLS 1.3 handshakes.</text>
      <!-- Tags -->
      <g transform="translate(16, 78)">
        <rect x="0" y="0" width="70" height="18" rx="2" fill="#162234" />
        <text x="35" y="12" text-anchor="middle" class="p-tag" fill="#00E5FF">AES-256</text>
        <rect x="76" y="0" width="70" height="18" rx="2" fill="#162234" />
        <text x="111" y="12" text-anchor="middle" class="p-tag">RSA-4096</text>
        <rect x="152" y="0" width="60" height="18" rx="2" fill="#162234" />
        <text x="182" y="12" text-anchor="middle" class="p-tag">TLS 1.3</text>
        <rect x="218" y="0" width="96" height="18" rx="2" fill="#162234" />
        <text x="266" y="12" text-anchor="middle" class="p-tag">Diffie-Hellman</text>
      </g>
      <text x="16" y="112" fill="#00E5FF" font-size="9" font-family="'SF Mono', monospace">MATHEMATICAL VERIFICATION // RFC 8446</text>
    </g>

    <!-- Card 6: Forensic Artifact Analysis -->
    <g transform="translate(434, 282)">
      <rect width="418" height="124" rx="5" fill="#111722" stroke="#1c283c" stroke-width="1" />
      <line x1="0" y1="0" x2="3" y2="124" stroke="#FF304F" stroke-width="3" />
      <text x="16" y="24" class="p-mono p-title-red">[+] Forensic Artifact Analysis :: DFIR</text>
      <text x="16" y="44" class="p-desc">Memory dump acquisition triage, Volatility plugin scripting, Windows</text>
      <text x="16" y="58" class="p-desc">MFT analysis, registry forensics, and automated timeline reconstruction.</text>
      <!-- Tags -->
      <g transform="translate(16, 78)">
        <rect x="0" y="0" width="76" height="18" rx="2" fill="#162234" />
        <text x="38" y="12" text-anchor="middle" class="p-tag" fill="#FF304F">Volatility</text>
        <rect x="82" y="0" width="66" height="18" rx="2" fill="#162234" />
        <text x="115" y="12" text-anchor="middle" class="p-tag">Autopsy</text>
        <rect x="154" y="0" width="124" height="18" rx="2" fill="#162234" />
        <text x="216" y="12" text-anchor="middle" class="p-tag">Memory Forensics</text>
        <rect x="284" y="0" width="50" height="18" rx="2" fill="#162234" />
        <text x="309" y="12" text-anchor="middle" class="p-tag">DFIR</text>
      </g>
      <text x="16" y="112" fill="#8B949E" font-size="9" font-family="'SF Mono', monospace">INCIDENT RESPONSE TRIAGE TOOLKIT</text>
    </g>

  </g>
</svg>
