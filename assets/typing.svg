<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="termVoid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A0F" />
      <stop offset="100%" stop-color="#0B0F17" />
    </linearGradient>
    <linearGradient id="topRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#00E5FF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FF304F" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <style>
    .t-code { font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace; font-size: 13px; }
    .t-dim { fill: #485c7b; }
    .t-cyan { fill: #00E5FF; }
    .t-red { fill: #FF304F; font-weight: 700; }
    .t-white { fill: #FFFFFF; font-weight: 500; }
    .t-gray { fill: #8B949E; }
    
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .cursor { animation: blinkCursor 0.8s infinite; }

    @keyframes fadeLine1 { 0%, 5% { opacity: 0; transform: translateX(-5px); } 12%, 100% { opacity: 1; transform: translateX(0); } }
    @keyframes fadeLine2 { 0%, 20% { opacity: 0; transform: translateX(-5px); } 30%, 100% { opacity: 1; transform: translateX(0); } }
    @keyframes fadeLine3 { 0%, 40% { opacity: 0; transform: translateX(-5px); } 50%, 100% { opacity: 1; transform: translateX(0); } }
    @keyframes fadeLine4 { 0%, 60% { opacity: 0; transform: translateX(-5px); } 70%, 100% { opacity: 1; transform: translateX(0); } }
    @keyframes fadeLine5 { 0%, 80% { opacity: 0; transform: translateX(-5px); } 90%, 100% { opacity: 1; transform: translateX(0); } }

    .line-1 { animation: fadeLine1 10s infinite; }
    .line-2 { animation: fadeLine2 10s infinite; }
    .line-3 { animation: fadeLine3 10s infinite; }
    .line-4 { animation: fadeLine4 10s infinite; }
    .line-5 { animation: fadeLine5 10s infinite; }
  </style>

  <!-- Frame Background -->
  <rect width="900" height="240" rx="8" fill="url(#termVoid)" stroke="#162032" stroke-width="1.2" />

  <!-- Window Top Bar -->
  <path d="M 0 8 C 0 3.58 3.58 0 8 0 L 892 0 C 896.42 0 900 3.58 900 8 L 900 34 L 0 34 Z" fill="#111722" stroke="#162032" stroke-width="1" />
  <line x1="0" y1="34" x2="900" y2="34" stroke="url(#topRim)" stroke-width="1.2" />

  <!-- Window Dots -->
  <circle cx="20" cy="17" r="4.5" fill="#FF304F" />
  <circle cx="36" cy="17" r="4.5" fill="#eab308" />
  <circle cx="52" cy="17" r="4.5" fill="#00E5FF" />

  <!-- Title -->
  <text x="450" y="21" fill="#667a99" font-size="11" font-weight="600" text-anchor="middle" class="t-code">
    session: kg-sec-kernel // pid: 9042 // bash
  </text>
  <text x="876" y="21" fill="#FF304F" font-size="10" font-weight="700" text-anchor="end" class="t-code">LIVE_FEED</text>

  <!-- Terminal Output -->
  <g transform="translate(24, 64)">
    <!-- Line 1 -->
    <g class="line-1">
      <text x="0" y="0" class="t-code">
        <tspan class="t-dim">[09:08:11]</tspan>
        <tspan class="t-cyan"> &gt; INITIATING_SOC_SESSION </tspan>
        <tspan class="t-white">--target lab.kartikgurung.sec</tspan>
        <tspan class="t-dim"> ... </tspan>
        <tspan class="t-cyan">[AUTHENTICATED]</tspan>
      </text>
    </g>

    <!-- Line 2 -->
    <g class="line-2" transform="translate(0, 26)">
      <text x="0" y="0" class="t-code">
        <tspan class="t-dim">[09:08:12]</tspan>
        <tspan class="t-cyan"> &gt; OPERATOR_IDENTITY: </tspan>
        <tspan class="t-white" font-weight="700">Kartik Gurung</tspan>
        <tspan class="t-gray"> // B.Tech CSE (Cybersecurity Specialization)</tspan>
      </text>
    </g>

    <!-- Line 3 -->
    <g class="line-3" transform="translate(0, 52)">
      <text x="0" y="0" class="t-code">
        <tspan class="t-dim">[09:08:13]</tspan>
        <tspan class="t-cyan"> &gt; PRIMARY_MISSION: </tspan>
        <tspan class="t-white">Digital Forensics (DFIR) &amp; Adversary Simulation &amp; Network Defense</tspan>
      </text>
    </g>

    <!-- Line 4 -->
    <g class="line-4" transform="translate(0, 78)">
      <text x="0" y="0" class="t-code">
        <tspan class="t-dim">[09:08:14]</tspan>
        <tspan class="t-cyan"> &gt; CORE_FRAMEWORK: </tspan>
        <tspan class="t-red">NetVision</tspan>
        <tspan class="t-gray"> [Real-Time Packet Dissection &amp; Threat Telemetry Engine]</tspan>
      </text>
    </g>

    <!-- Line 5 -->
    <g class="line-5" transform="translate(0, 104)">
      <text x="0" y="0" class="t-code">
        <tspan class="t-dim">[09:08:15]</tspan>
        <tspan class="t-cyan"> &gt; STATUS: </tspan>
        <tspan class="t-white">DEFENSIVE ENGINE DEPLOYED // STANDBY FOR SECURITY RESEARCH &gt;&gt;</tspan>
        <tspan class="t-red cursor"> █</tspan>
      </text>
    </g>
  </g>
</svg>
