<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#04070d" />
    </linearGradient>
    <linearGradient id="headerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00ff66" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <style>
    .t-mono { font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace; font-size: 13px; }
    .t-key { fill: #38bdf8; font-weight: 600; }
    .t-str { fill: #00ff66; }
    .t-val { fill: #f8fafc; }
    .t-num { fill: #fbbf24; }
    .t-punct { fill: #64748b; }
    .t-prompt { fill: #00e5ff; font-weight: 700; }
    .t-cmd { fill: #e2e8f0; font-weight: 500; }
    @keyframes termBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .t-cursor { animation: termBlink 1s infinite; }
  </style>

  <!-- Terminal Frame -->
  <rect width="900" height="270" rx="12" fill="url(#termBg)" stroke="#1e293b" stroke-width="1.2" />
  
  <!-- Terminal Top Bar -->
  <path d="M 0 12 C 0 5.37 5.37 0 12 0 L 888 0 C 894.63 0 900 5.37 900 12 L 900 38 L 0 38 Z" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <line x1="0" y1="38" x2="900" y2="38" stroke="url(#headerBorder)" stroke-width="1" />

  <!-- Mac / Linux Terminal Window Controls -->
  <circle cx="22" cy="19" r="6" fill="#ef4444" />
  <circle cx="42" cy="19" r="6" fill="#f59e0b" />
  <circle cx="62" cy="19" r="6" fill="#10b981" />

  <!-- Terminal Window Title -->
  <text x="450" y="23" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    kartik@security-core: ~ /identity.json
  </text>
  
  <text x="860" y="23" fill="#475569" font-size="11" text-anchor="end" class="t-mono">zsh</text>

  <!-- Terminal Content -->
  <!-- Line 1: Command -->
  <g transform="translate(24, 66)">
    <text x="0" y="0" class="t-mono">
      <tspan class="t-prompt">kartik@security-core</tspan>
      <tspan class="t-punct">:</tspan>
      <tspan fill="#a855f7">~</tspan>
      <tspan class="t-punct">$ </tspan>
      <tspan class="t-cmd">curl -s https://telemetry.kartikgurung.sec/v1/profile | jq .</tspan>
    </text>
  </g>

  <!-- JSON Payload Output -->
  <g transform="translate(24, 94)">
    <!-- { -->
    <text x="0" y="0" class="t-mono t-punct">{</text>
    
    <!-- "developer": "Kartik Gurung", -->
    <text x="24" y="20" class="t-mono">
      <tspan class="t-key">"identity"</tspan><tspan class="t-punct">: </tspan><tspan class="t-str">"Kartik Gurung"</tspan><tspan class="t-punct">,</tspan>
    </text>

    <!-- "education": "B.Tech CSE - Cybersecurity Specialization", -->
    <text x="24" y="40" class="t-mono">
      <tspan class="t-key">"education"</tspan><tspan class="t-punct">: </tspan><tspan class="t-str">"B.Tech CSE (Cybersecurity Specialization)"</tspan><tspan class="t-punct">,</tspan>
    </text>

    <!-- "core_focus": ["Network Defense", "Penetration Testing", "Digital Forensics"], -->
    <text x="24" y="60" class="t-mono">
      <tspan class="t-key">"core_focus"</tspan><tspan class="t-punct">: [</tspan><tspan class="t-str">"Network Defense"</tspan><tspan class="t-punct">, </tspan><tspan class="t-str">"Ethical Hacking"</tspan><tspan class="t-punct">, </tspan><tspan class="t-str">"Digital Forensics"</tspan><tspan class="t-punct">],</tspan>
    </text>

    <!-- "flagship_projects": ["NetVision", "Network Security Lab"], -->
    <text x="24" y="80" class="t-mono">
      <tspan class="t-key">"flagship_projects"</tspan><tspan class="t-punct">: [</tspan><tspan class="t-str">"NetVision (Packet Telemetry)"</tspan><tspan class="t-punct">, </tspan><tspan class="t-str">"Network Security Lab"</tspan><tspan class="t-punct">],</tspan>
    </text>

    <!-- "status": "Ready for Security Research & Collaborative Engineering" -->
    <text x="24" y="100" class="t-mono">
      <tspan class="t-key">"status"</tspan><tspan class="t-punct">: </tspan><tspan class="t-str">"Active // Open for Security Research &amp; Engineering"</tspan>
    </text>

    <!-- } -->
    <text x="0" y="120" class="t-mono t-punct">}</text>

    <!-- Next line prompt with blinking cursor -->
    <text x="0" y="144" class="t-mono">
      <tspan class="t-prompt">kartik@security-core</tspan>
      <tspan class="t-punct">:</tspan>
      <tspan fill="#a855f7">~</tspan>
      <tspan class="t-punct">$ </tspan>
      <tspan fill="#00e5ff" class="t-cursor">█</tspan>
    </text>
  </g>
</svg>

