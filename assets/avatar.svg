<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="socAvatarBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#111722" />
      <stop offset="60%" stop-color="#080A0F" />
      <stop offset="100%" stop-color="#030407" />
    </radialGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanRedRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="60%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#FF304F" />
    </linearGradient>

    <linearGradient id="shieldFillSOC" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c2b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#090d15" stop-opacity="0.98" />
    </linearGradient>

    <!-- Filters -->
    <filter id="avatarGlowSOC" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .av-mono { font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace; }
    .av-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
  </style>

  <!-- Base Circle -->
  <circle cx="200" cy="200" r="196" fill="url(#socAvatarBg)" stroke="#162032" stroke-width="2" />

  <!-- Outer Concentric Reticle Rings -->
  <circle cx="200" cy="200" r="180" fill="none" stroke="#162032" stroke-width="1.2" stroke-dasharray="4 6" />
  <circle cx="200" cy="200" r="166" fill="none" stroke="url(#cyanRedRing)" stroke-width="2" stroke-dasharray="160 30 50 25 70 35" filter="url(#subtleNeon)" />
  <circle cx="200" cy="200" r="148" fill="none" stroke="#00E5FF" stroke-width="0.8" stroke-dasharray="3 5" opacity="0.4" />

  <!-- Top / Bottom Metadata Annotations -->
  <text x="200" y="30" fill="#445571" font-size="7" font-weight="700" text-anchor="middle" letter-spacing="3" class="av-mono">SEC-ID: KG-9042 // OPERATOR</text>
  <text x="200" y="380" fill="#445571" font-size="7" font-weight="700" text-anchor="middle" letter-spacing="3" class="av-mono">CLEARANCE: RESTRICTED // SOC-OPS</text>

  <!-- Reticle Cardinal Ticks -->
  <path d="M 200 6 L 200 18 M 200 382 L 200 394 M 6 200 L 18 200 M 382 200 L 394 200" stroke="#00E5FF" stroke-width="2" />
  <circle cx="200" cy="18" r="2.5" fill="#FF304F" />
  <circle cx="200" cy="382" r="2.5" fill="#00E5FF" />
  <circle cx="18" cy="200" r="2.5" fill="#00E5FF" />
  <circle cx="382" cy="200" r="2.5" fill="#FF304F" />

  <!-- Central Sentinel Shield Emblem -->
  <g transform="translate(200, 192)">
    <!-- Shield Border with Glowing Gradient -->
    <path d="M 0 -85 L 75 -45 L 75 35 C 75 75 0 105 0 105 C 0 105 -75 75 -75 35 L -75 -45 Z"
          fill="none" stroke="url(#cyanRedRing)" stroke-width="3" filter="url(#avatarGlowSOC)" />
    
    <!-- Inner Shield Body -->
    <path d="M 0 -82 L 72 -43 L 72 34 C 72 72 0 101 0 101 C 0 101 -72 72 -72 34 L -72 -43 Z"
          fill="url(#shieldFillSOC)" stroke="#1a273b" stroke-width="1.2" />

    <!-- Technical Crosshair & Circuit Nodes -->
    <line x1="-55" y1="0" x2="-25" y2="0" stroke="#00E5FF" stroke-width="1.2" opacity="0.6" />
    <circle cx="-25" cy="0" r="2.5" fill="#00E5FF" />
    <line x1="55" y1="0" x2="25" y2="0" stroke="#FF304F" stroke-width="1.2" opacity="0.6" />
    <circle cx="25" cy="0" r="2.5" fill="#FF304F" />

    <!-- Stylized Monogram "KG" -->
    <text x="0" y="16" fill="#ffffff" font-size="44" font-weight="900" text-anchor="middle" letter-spacing="3" class="av-sans" filter="url(#subtleNeon)">
      KG
    </text>

    <!-- Technical Status Pill -->
    <rect x="-42" y="44" width="84" height="17" rx="3" fill="#080A0F" stroke="#00E5FF" stroke-width="0.8" />
    <text x="0" y="56" fill="#00E5FF" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="1.5" class="av-mono">
      FORENSICS
    </text>
  </g>

  <!-- Peripheral Corner Nodes -->
  <circle cx="95" cy="110" r="3" fill="#00E5FF" filter="url(#subtleNeon)" />
  <circle cx="305" cy="110" r="3" fill="#FF304F" filter="url(#subtleNeon)" />
  <circle cx="85" cy="280" r="3" fill="#FF304F" filter="url(#subtleNeon)" />
  <circle cx="315" cy="280" r="3" fill="#00E5FF" filter="url(#subtleNeon)" />
</svg>
