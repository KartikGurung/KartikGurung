<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="avatarBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#04060a" />
    </radialGradient>

    <!-- Glowing Cyber Gradients -->
    <linearGradient id="cyberCyanGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#00ff66" />
    </linearGradient>

    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Filters -->
    <filter id="avatarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono-avatar { font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace; }
    .sans-avatar { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
  </style>

  <!-- Base Circle -->
  <circle cx="200" cy="200" r="196" fill="url(#avatarBg)" stroke="#1e293b" stroke-width="2" />

  <!-- Concentric Cyber Rings -->
  <circle cx="200" cy="200" r="178" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6 8" />
  <circle cx="200" cy="200" r="165" fill="none" stroke="url(#cyberCyanGreen)" stroke-width="2" stroke-dasharray="140 30 60 25 80 40" filter="url(#coreGlow)" opacity="0.85" />
  <circle cx="200" cy="200" r="148" fill="none" stroke="#00e5ff" stroke-width="0.8" stroke-dasharray="4 6" opacity="0.4" />

  <!-- Binary Ring Accents -->
  <text x="200" y="32" fill="#334155" font-size="7.5" font-weight="600" text-anchor="middle" letter-spacing="4" class="mono-avatar">01001011 01000001 01010010 01010100 01001001 01001011</text>
  <text x="200" y="378" fill="#334155" font-size="7.5" font-weight="600" text-anchor="middle" letter-spacing="4" class="mono-avatar">SEC_OPS // FORENSICS // RED_TEAM</text>

  <!-- Outer Cyber Ticks -->
  <path d="M 200 8 L 200 18 M 200 382 L 200 392 M 8 200 L 18 200 M 382 200 L 392 200" stroke="#00e5ff" stroke-width="2" />
  <circle cx="200" cy="18" r="3" fill="#00ff66" />
  <circle cx="200" cy="382" r="3" fill="#00e5ff" />
  <circle cx="18" cy="200" r="3" fill="#00e5ff" />
  <circle cx="382" cy="200" r="3" fill="#00ff66" />

  <!-- Central Cyber Shield Emblem -->
  <g transform="translate(200, 192)">
    <!-- Outer Shield Shadow / Glow -->
    <path d="M 0 -85 L 75 -45 L 75 35 C 75 75 0 105 0 105 C 0 105 -75 75 -75 35 L -75 -45 Z"
          fill="none" stroke="url(#cyberCyanGreen)" stroke-width="3.5" filter="url(#avatarGlow)" />
    
    <!-- Inner Shield Body -->
    <path d="M 0 -82 L 72 -43 L 72 34 C 72 72 0 101 0 101 C 0 101 -72 72 -72 34 L -72 -43 Z"
          fill="url(#shieldFill)" stroke="#38bdf8" stroke-width="1.2" />

    <!-- Circuit Pattern inside Shield -->
    <path d="M -50 -20 L -25 -20 L -10 -5 L -10 30" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <circle cx="-10" cy="30" r="3" fill="#00e5ff" />
    <path d="M 50 -20 L 25 -20 L 10 -5 L 10 30" fill="none" stroke="#00ff66" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <circle cx="10" cy="30" r="3" fill="#00ff66" />

    <!-- Stylized Monogram "KG" in Center -->
    <text x="0" y="16" fill="#ffffff" font-size="44" font-weight="900" text-anchor="middle" letter-spacing="3" class="sans-avatar" filter="url(#coreGlow)">
      KG
    </text>

    <!-- Small Terminal Status Pill inside shield bottom -->
    <rect x="-35" y="44" width="70" height="16" rx="4" fill="#090d16" stroke="#00e5ff" stroke-width="0.8" />
    <text x="0" y="55" fill="#00e5ff" font-size="8.5" font-weight="700" text-anchor="middle" letter-spacing="1" class="mono-avatar">
      ETHICAL
    </text>
  </g>

  <!-- Node points -->
  <circle cx="95" cy="110" r="3.5" fill="#00e5ff" filter="url(#coreGlow)" />
  <circle cx="305" cy="110" r="3.5" fill="#00ff66" filter="url(#coreGlow)" />
  <circle cx="85" cy="280" r="3.5" fill="#00ff66" filter="url(#coreGlow)" />
  <circle cx="315" cy="280" r="3.5" fill="#00e5ff" filter="url(#coreGlow)" />

  <line x1="95" y1="110" x2="128" y2="148" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3" />
  <line x1="305" y1="110" x2="272" y2="148" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3" />
</svg>

