<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="deepVoid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070a" />
      <stop offset="50%" stop-color="#080a0f" />
      <stop offset="100%" stop-color="#0b0e14" />
    </linearGradient>

    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111722" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#090d15" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="cyanRedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="65%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#FF304F" />
    </linearGradient>

    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF304F" />
      <stop offset="100%" stop-color="#ff6b81" />
    </linearGradient>

    <linearGradient id="scanlineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="neonCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neonRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Background Patterns -->
    <pattern id="socGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#161f30" stroke-width="0.7" stroke-opacity="0.6" />
      <circle cx="30" cy="30" r="0.8" fill="#00E5FF" fill-opacity="0.4" />
    </pattern>

    <pattern id="hexTech" width="24" height="41.56" patternUnits="userSpaceOnUse">
      <path d="M12 0 L24 6.92 L24 20.78 L12 27.71 L0 20.78 L0 6.92 Z M12 27.71 L24 34.64 L24 41.56 L12 41.56 L0 41.56 L0 34.64 Z" 
            fill="none" stroke="#101724" stroke-width="0.8" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseThreat {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px #FF304F); }
      50% { opacity: 0.35; filter: none; }
    }
    @keyframes sweepLine {
      0% { transform: translateY(-50px); }
      100% { transform: translateY(430px); }
    }
    @keyframes glitchFlicker {
      0%, 96%, 100% { transform: translate(0, 0); opacity: 1; }
      97% { transform: translate(-2px, 1px); opacity: 0.9; }
      98% { transform: translate(2px, -1px); opacity: 0.95; }
      99% { transform: translate(-1px, -1px); opacity: 0.85; }
    }
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .glitch-text { animation: glitchFlicker 6s infinite ease-in-out; }
    .threat-pulse { animation: pulseThreat 1.8s infinite ease-in-out; }
    .scan-beam { animation: sweepLine 5s infinite linear; }
    .blink-block { animation: cursorBlink 0.9s infinite; }
    .mono { font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="420" fill="url(#deepVoid)" stroke="#162030" stroke-width="1.5" />

  <!-- SOC Background Matrix -->
  <rect width="1200" height="420" fill="url(#socGrid)" />
  <rect x="740" y="20" width="430" height="380" fill="url(#hexTech)" opacity="0.6" />

  <!-- Scanline Beam (Cybernetic Optics) -->
  <rect x="0" y="0" width="1200" height="40" fill="url(#scanlineGrad)" class="scan-beam" pointer-events="none" />

  <!-- Top Accent Horizon Lines -->
  <line x1="0" y1="0" x2="800" y2="0" stroke="#00E5FF" stroke-width="2.5" filter="url(#neonCyan)" />
  <line x1="800" y1="0" x2="1200" y2="0" stroke="#FF304F" stroke-width="2.5" filter="url(#neonRed)" />

  <!-- Corner Crosshairs / HUD Reticles -->
  <path d="M 20 40 L 20 20 L 40 20" stroke="#00E5FF" stroke-width="1.8" fill="none" />
  <path d="M 1180 40 L 1180 20 L 1160 20" stroke="#FF304F" stroke-width="1.8" fill="none" />
  <path d="M 20 380 L 20 400 L 40 400" stroke="#00E5FF" stroke-width="1.8" fill="none" />
  <path d="M 1180 380 L 1180 400 L 1160 400" stroke="#FF304F" stroke-width="1.8" fill="none" />

  <!-- Technical Watermark / Coordinate Annotations -->
  <text x="50" y="26" fill="#41516c" font-size="9" class="mono" letter-spacing="2">LAT 28.6139° N / LON 77.2090° E // NODE: KERNEL-PROD-01</text>
  <text x="1150" y="26" fill="#41516c" font-size="9" class="mono" text-anchor="end" letter-spacing="1">DEFCON 3 // ELEVATED MONITORING</text>

  <!-- ================= LEFT: IDENTITY & TERMINAL ================= -->
  <!-- Operational Clearance Badge -->
  <g transform="translate(50, 52)">
    <rect width="360" height="26" rx="4" fill="#0d131f" stroke="#1c283d" stroke-width="1" />
    <circle cx="14" cy="13" r="3.5" fill="#FF304F" class="threat-pulse" />
    <text x="28" y="17" fill="#FF304F" font-size="10" font-weight="700" letter-spacing="1.5" class="mono">SOC-LABS // RESTRICTED ACCESS LEVEL 4</text>
    <rect x="312" y="5" width="40" height="16" rx="2" fill="#162236" />
    <text x="320" y="16" fill="#00E5FF" font-size="9" font-weight="700" class="mono">SEC</text>
  </g>

  <!-- Main Name Header with Cyber Stencil / Glitch Aesthetic -->
  <g transform="translate(50, 142)" class="glitch-text">
    <text x="0" y="0" fill="#ffffff" font-size="52" font-weight="900" letter-spacing="2" class="sans">
      KARTIK GURUNG
    </text>
    <text x="525" y="-12" fill="#00E5FF" font-size="14" font-weight="700" class="mono" filter="url(#neonCyan)">[KG-0x7F]</text>
  </g>

  <!-- Role Subtitle with Dual Accent Bar -->
  <g transform="translate(50, 180)">
    <text x="0" y="0" fill="#00E5FF" font-size="15" font-weight="700" letter-spacing="3" class="mono">
      CYBERSECURITY RESEARCHER // REVERSE ENGINEERING // DFIR
    </text>
  </g>

  <!-- Tactical Metadata Badges -->
  <g transform="translate(50, 214)">
    <!-- Badge 1: Network Defense -->
    <g transform="translate(0, 0)">
      <rect width="148" height="26" rx="3" fill="#0b101a" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.8" />
      <circle cx="10" cy="13" r="2.5" fill="#00E5FF" />
      <text x="20" y="17" fill="#e1e7f0" font-size="10" font-weight="600" class="mono">NETWORK DEFENSE</text>
    </g>
    <!-- Badge 2: Offensive Security -->
    <g transform="translate(158, 0)">
      <rect width="168" height="26" rx="3" fill="#0b101a" stroke="#FF304F" stroke-width="1" stroke-opacity="0.8" />
      <circle cx="10" cy="13" r="2.5" fill="#FF304F" />
      <text x="20" y="17" fill="#e1e7f0" font-size="10" font-weight="600" class="mono">OFFENSIVE SECURITY</text>
    </g>
    <!-- Badge 3: Digital Forensics -->
    <g transform="translate(336, 0)">
      <rect width="158" height="26" rx="3" fill="#0b101a" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="10" cy="13" r="2.5" fill="#00E5FF" />
      <text x="20" y="17" fill="#e1e7f0" font-size="10" font-weight="600" class="mono">DIGITAL FORENSICS</text>
    </g>
    <!-- Badge 4: Threat Intelligence -->
    <g transform="translate(504, 0)">
      <rect width="152" height="26" rx="3" fill="#0b101a" stroke="#8b9bb4" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="10" cy="13" r="2.5" fill="#8b9bb4" />
      <text x="20" y="17" fill="#8b9bb4" font-size="10" font-weight="600" class="mono">THREAT RESEARCH</text>
    </g>
  </g>

  <!-- Interactive Terminal Frame -->
  <g transform="translate(50, 268)">
    <rect width="640" height="114" rx="6" fill="#070a0f" stroke="#1c273a" stroke-width="1.2" />
    <!-- Terminal Titlebar -->
    <rect width="640" height="24" rx="6" fill="#0f1624" />
    <circle cx="14" cy="12" r="3.5" fill="#FF304F" />
    <circle cx="28" cy="12" r="3.5" fill="#eab308" />
    <circle cx="42" cy="12" r="3.5" fill="#00E5FF" />
    <text x="320" y="16" fill="#5a6e8b" font-size="10" text-anchor="middle" class="mono">investigator@sentinel-station: /opt/netvision</text>
    
    <!-- Terminal Lines -->
    <text x="16" y="48" fill="#00E5FF" font-size="12" font-weight="700" class="mono">root@sentinel-station:~#</text>
    <text x="210" y="48" fill="#ffffff" font-size="12" class="mono">./netvision --inspect-live --filter "tcp.port==443"</text>
    
    <text x="16" y="70" fill="#48607f" font-size="11" class="mono">[+] DISSECTOR INITIALIZED // INTERFACE: eth0 [PROMISCUOUS]</text>
    <text x="16" y="88" fill="#00E5FF" font-size="11" class="mono">[✓] INTRUSION DETECTION MODEL: RUNNING</text>
    <text x="310" y="88" fill="#FF304F" font-size="11" font-weight="700" class="mono">[!] 0 ANOMALIES FLAGGED</text>
    
    <text x="16" y="106" fill="#00E5FF" font-size="11" class="mono">&gt; listening on tap socket...</text>
    <rect x="205" y="96" width="7" height="12" fill="#00E5FF" class="blink-block" />
  </g>

  <!-- ================= RIGHT: SOC TELEMETRY DASHBOARD ================= -->
  <g transform="translate(730, 52)">
    <rect width="420" height="330" rx="8" fill="url(#panelGrad)" stroke="#1a2538" stroke-width="1.4" />
    <!-- Panel Header -->
    <rect width="420" height="28" rx="8" fill="#0f1624" stroke="#1a2538" stroke-width="1" />
    <text x="16" y="18" fill="#00E5FF" font-size="10" font-weight="700" letter-spacing="1.5" class="mono">
      ⌖ LIVE LAB TELEMETRY &amp; ENVIRONMENT HUD
    </text>
    <circle cx="400" cy="14" r="3.5" fill="#00E5FF" class="threat-pulse" />

    <!-- Metric 1: Operator Degree / Track -->
    <g transform="translate(18, 48)">
      <text x="0" y="12" fill="#667a99" font-size="10" class="mono">ACADEMIC FOUNDATION</text>
      <text x="0" y="28" fill="#f8fafc" font-size="12" font-weight="600" class="mono">B.Tech CSE [Cybersecurity Track]</text>
      <line x1="0" y1="38" x2="384" y2="38" stroke="#162032" stroke-width="1" />
    </g>

    <!-- Metric 2: Primary Focus / Mission -->
    <g transform="translate(18, 102)">
      <text x="0" y="12" fill="#667a99" font-size="10" class="mono">ACTIVE RESEARCH INITIATIVE</text>
      <text x="0" y="28" fill="#00E5FF" font-size="12" font-weight="700" class="mono">NetVision Packet Telemetry Suite</text>
      <line x1="0" y1="38" x2="384" y2="38" stroke="#162032" stroke-width="1" />
    </g>

    <!-- Metric 3: Cryptographic Cipher Stack -->
    <g transform="translate(18, 156)">
      <text x="0" y="12" fill="#667a99" font-size="10" class="mono">CRYPTOSYSTEM RIG</text>
      <text x="0" y="28" fill="#FF304F" font-size="11" font-weight="700" class="mono">AES-256-GCM / CHACHA20 / TLS 1.3</text>
      <line x1="0" y1="38" x2="384" y2="38" stroke="#162032" stroke-width="1" />
    </g>

    <!-- Metric 4: Real-time Threat Spectrum Waveform -->
    <g transform="translate(18, 210)">
      <text x="0" y="12" fill="#667a99" font-size="10" class="mono">PACKET INSPECTION TELEMETRY [LIVE STREAM]</text>
      
      <!-- Waveform Bars -->
      <g transform="translate(0, 24)">
        <rect x="0" y="10" width="7" height="22" rx="1.5" fill="#00E5FF" opacity="0.9" />
        <rect x="12" y="4" width="7" height="28" rx="1.5" fill="#00E5FF" opacity="0.75" />
        <rect x="24" y="16" width="7" height="16" rx="1.5" fill="#1a2538" />
        <rect x="36" y="2" width="7" height="30" rx="1.5" fill="#FF304F" opacity="0.95" />
        <rect x="48" y="8" width="7" height="24" rx="1.5" fill="#00E5FF" opacity="0.8" />
        <rect x="60" y="14" width="7" height="18" rx="1.5" fill="#1a2538" />
        <rect x="72" y="6" width="7" height="26" rx="1.5" fill="#00E5FF" opacity="0.9" />
        <rect x="84" y="1" width="7" height="31" rx="1.5" fill="#FF304F" opacity="0.85" />
        <rect x="96" y="12" width="7" height="20" rx="1.5" fill="#00E5FF" opacity="0.7" />
        <rect x="108" y="18" width="7" height="14" rx="1.5" fill="#1a2538" />
        <rect x="120" y="5" width="7" height="27" rx="1.5" fill="#00E5FF" opacity="0.9" />
        <rect x="132" y="11" width="7" height="21" rx="1.5" fill="#00E5FF" opacity="0.8" />
        <rect x="144" y="3" width="7" height="29" rx="1.5" fill="#FF304F" opacity="0.9" />
        <rect x="156" y="15" width="7" height="17" rx="1.5" fill="#1a2538" />
        <rect x="168" y="7" width="7" height="25" rx="1.5" fill="#00E5FF" opacity="0.85" />
        <rect x="180" y="0" width="7" height="32" rx="1.5" fill="#00E5FF" opacity="1" filter="url(#neonCyan)" />
        <rect x="192" y="9" width="7" height="23" rx="1.5" fill="#00E5FF" opacity="0.8" />
        <rect x="204" y="4" width="7" height="28" rx="1.5" fill="#FF304F" opacity="0.9" />
        <rect x="216" y="14" width="7" height="18" rx="1.5" fill="#1a2538" />
        <rect x="228" y="8" width="7" height="24" rx="1.5" fill="#00E5FF" opacity="0.8" />
        <rect x="240" y="2" width="7" height="30" rx="1.5" fill="#00E5FF" opacity="0.95" />
        <rect x="252" y="12" width="7" height="20" rx="1.5" fill="#1a2538" />
        <rect x="264" y="6" width="7" height="26" rx="1.5" fill="#FF304F" opacity="0.85" />
        <rect x="276" y="10" width="7" height="22" rx="1.5" fill="#00E5FF" opacity="0.75" />
        <rect x="288" y="16" width="7" height="16" rx="1.5" fill="#1a2538" />
        <rect x="300" y="3" width="7" height="29" rx="1.5" fill="#00E5FF" opacity="0.9" />
        <rect x="312" y="8" width="7" height="24" rx="1.5" fill="#00E5FF" opacity="0.8" />
        <rect x="324" y="1" width="7" height="31" rx="1.5" fill="#FF304F" opacity="0.95" filter="url(#neonRed)" />
        <rect x="336" y="13" width="7" height="19" rx="1.5" fill="#1a2538" />
        <rect x="348" y="5" width="7" height="27" rx="1.5" fill="#00E5FF" opacity="0.85" />
        <rect x="360" y="11" width="7" height="21" rx="1.5" fill="#00E5FF" opacity="0.7" />
        <rect x="372" y="7" width="7" height="25" rx="1.5" fill="#00E5FF" opacity="0.8" />
      </g>
    </g>

    <!-- Bottom Hash Footprint -->
    <g transform="translate(18, 288)">
      <rect width="384" height="24" rx="3" fill="#080c14" stroke="#162032" stroke-width="0.8" />
      <text x="10" y="16" fill="#4d627f" font-size="9" class="mono">HASH:</text>
      <text x="48" y="16" fill="#00E5FF" font-size="9" class="mono">SHA256: 4a9f8b...e92c7104b</text>
      <text x="310" y="16" fill="#FF304F" font-size="9" font-weight="700" class="mono">[VERIFIED]</text>
    </g>
  </g>
</svg>
