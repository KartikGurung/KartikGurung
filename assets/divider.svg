<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 20" width="100%" height="20">
  <defs>
    <linearGradient id="cyberSplit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0" />
      <stop offset="30%" stop-color="#00E5FF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="70%" stop-color="#FF304F" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FF304F" stop-opacity="0" />
    </linearGradient>
    <filter id="divGlow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Technical baseline -->
  <line x1="40" y1="10" x2="860" y2="10" stroke="#162030" stroke-width="1" />
  <line x1="120" y1="10" x2="780" y2="10" stroke="url(#cyberSplit)" stroke-width="1.5" filter="url(#divGlow)" />
  
  <!-- Center HUD crosshair -->
  <polygon points="450,5 455,10 450,15 445,10" fill="#FF304F" />
  <circle cx="430" cy="10" r="1.5" fill="#00E5FF" />
  <circle cx="470" cy="10" r="1.5" fill="#00E5FF" />
  <text x="450" y="19" fill="#3a4b66" font-size="6" font-family="'SF Mono', monospace" text-anchor="middle" letter-spacing="3">SEC_DELIMITER</text>
</svg>
