      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0" />
      <stop offset="35%" stop-color="#00e5ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00ff66" stop-opacity="1" />
